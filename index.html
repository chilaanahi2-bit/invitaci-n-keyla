<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Keyla cumple 6 años</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0e0620;
    --bg-mid: #1e0f3d;
    --card: #2a1454;
    --card-2: #3a1c6b;
    --magenta: #ff3fa4;
    --cyan: #3ce8e0;
    --gold: #ffcb47;
    --lavender: #e3d4ff;
    --white: #fdf7ff;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-mid) 0%, var(--bg-deep) 65%);
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
  }

  .stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--white);
    border-radius: 50%;
    opacity: 0.7;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  .envelope-wrap {
    position: relative;
    width: min(88vw, 380px);
    aspect-ratio: 3/4;
    cursor: pointer;
    transition: opacity 0.6s ease 0.4s, transform 0.6s ease 0.4s;
  }
  .envelope-wrap.hidden {
    opacity: 0;
    transform: scale(0.85);
    pointer-events: none;
  }

  .envelope {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(160deg, var(--card-2), var(--card));
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset,
                0 20px 60px rgba(0,0,0,0.6),
                0 0 40px rgba(255, 63, 164, 0.25);
    overflow: hidden;
  }

  .envelope::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 62%;
    background: linear-gradient(155deg, #351a63, #24123f);
    clip-path: polygon(0 0, 50% 42%, 100% 0, 100% 100%, 0 100%);
  }

  .flap {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 58%;
    background: linear-gradient(200deg, var(--card), #201047);
    clip-path: polygon(0 0, 100% 0, 50% 78%);
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.6,-0.28,.35,1.5);
    z-index: 5;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  .flap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(200deg, rgba(255,255,255,0.06), transparent 60%);
  }

  .envelope-wrap.opening .flap {
    transform: rotateX(178deg);
  }

  .seal {
    position: absolute;
    top: 46%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 62px;
    height: 62px;
    z-index: 6;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ff6fc0, var(--magenta) 60%, #b8206e 100%);
    box-shadow: 0 0 18px rgba(255,63,164,0.8), 0 0 0 3px rgba(255,255,255,0.15) inset;
    font-size: 26px;
    transition: transform 0.4s ease, opacity 0.4s ease;
  }
  .envelope-wrap.opening .seal {
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
  }

  .envelope-label {
    position: absolute;
    bottom: 14%;
    left: 0; right: 0;
    text-align: center;
    color: var(--lavender);
    font-family: 'Caveat', cursive;
    font-size: 22px;
    letter-spacing: 0.5px;
    z-index: 4;
    animation: pulse-label 2s ease-in-out infinite;
  }
  @keyframes pulse-label {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  .envelope-wrap.opening .envelope-label { opacity: 0; }

  .card-wrap {
    position: absolute;
    width: min(90vw, 400px);
    max-height: 88vh;
    opacity: 0;
    transform: translateY(40px) scale(0.9);
    transition: opacity 0.7s ease, transform 0.7s cubic-bezier(.2,.8,.2,1);
    pointer-events: none;
  }
  .card-wrap.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .card {
    position: relative;
    border-radius: 22px;
    background:
      radial-gradient(circle at 20% 0%, rgba(255,63,164,0.25), transparent 45%),
      radial-gradient(circle at 90% 15%, rgba(60,232,224,0.2), transparent 40%),
      linear-gradient(175deg, #241150, #170a33 70%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 25px 70px rgba(0,0,0,0.65), 0 0 50px rgba(255,63,164,0.2);
    padding: 26px 22px 22px;
    max-height: 88vh;
    overflow-y: auto;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .card::-webkit-scrollbar { display: none; }

  .eyebrow {
    text-align: center;
    color: var(--cyan);
    font-family: 'Bungee', cursive;
    font-size: 13px;
    letter-spacing: 4px;
    text-shadow: 0 0 10px rgba(60,232,224,0.7);
    margin-bottom: 2px;
  }

  .title {
    text-align: center;
    font-family: 'Bungee', cursive;
    font-size: clamp(34px, 11vw, 46px);
    color: var(--white);
    text-shadow: 0 0 8px var(--magenta), 0 0 22px rgba(255,63,164,0.7), 0 0 44px rgba(255,63,164,0.4);
    margin: 2px 0 0;
    line-height: 1;
  }

  .subtitle {
    text-align: center;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 26px;
    color: var(--magenta);
    margin: 2px 0 6px;
  }

  .age-badge {
    display: block;
    margin: 6px auto 14px;
    width: fit-content;
    font-family: 'Bungee', cursive;
    font-size: 20px;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(255,203,71,0.8);
    border-top: 1px solid rgba(255,203,71,0.5);
    border-bottom: 1px solid rgba(255,203,71,0.5);
    padding: 4px 18px;
    letter-spacing: 2px;
  }

  .photo-frame {
    position: relative;
    margin: 0 auto 16px;
    width: 78%;
    aspect-ratio: 3/4;
    border-radius: 16px;
    padding: 4px;
    background: linear-gradient(145deg, var(--magenta), var(--cyan));
    box-shadow: 0 0 24px rgba(255,63,164,0.45);
  }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 13px;
    display: block;
  }
  .photo-frame .sparkle {
    position: absolute;
    font-size: 22px;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.8));
  }
  .sparkle.s1 { top: -14px; left: -10px; }
  .sparkle.s2 { bottom: -12px; right: -8px; }

  .message {
    text-align: center;
    color: var(--lavender);
    font-size: 14.5px;
    line-height: 1.5;
    margin: 0 auto 18px;
    max-width: 30ch;
  }

  .details {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 20px;
  }
  .detail {
    flex: 1;
    text-align: center;
    color: var(--white);
  }
  .detail .big {
    font-family: 'Bungee', cursive;
    font-size: 17px;
    color: var(--gold);
    text-shadow: 0 0 8px rgba(255,203,71,0.6);
    display: block;
    line-height: 1.2;
  }
  .detail .small {
    font-size: 10.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--lavender);
    opacity: 0.85;
  }
  .divider {
    width: 1px;
    background: linear-gradient(transparent, rgba(255,255,255,0.35), transparent);
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
    text-decoration: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    padding: 12px 16px;
    border-radius: 14px;
    color: var(--bg-deep);
    background: linear-gradient(120deg, var(--cyan), #7ef5ef);
    box-shadow: 0 6px 18px rgba(60,232,224,0.3);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.magenta {
    background: linear-gradient(120deg, var(--magenta), #ff7dc4);
    color: var(--white);
    box-shadow: 0 6px 18px rgba(255,63,164,0.35);
  }
  .btn.outline {
    background: transparent;
    border: 1.5px solid var(--gold);
    color: var(--gold);
    box-shadow: none;
  }

  .footer-note {
    text-align: center;
    margin-top: 16px;
    font-family: 'Caveat', cursive;
    font-size: 17px;
    color: var(--lavender);
    opacity: 0.75;
  }

  .confetti-piece {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 20;
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .flap, .card-wrap, .envelope-wrap, .seal { transition: none !important; animation: none !important; }
  }
</style>
</head>

<script>
  const starsEl = document.getElementById('stars');
  const starCount = 45;
  for (let i = 0; i < starCount; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
    starsEl.appendChild(s);
  }

  const envelopeWrap = document.getElementById('envelopeWrap');
  const cardWrap = document.getElementById('cardWrap');
  let opened = false;

  function burstConfetti() {
    const colors = ['#ff3fa4', '#3ce8e0', '#ffcb47', '#e3d4ff', '#ffffff'];
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      document.body.appendChild(p);
      const angle = Math.random() * Math.PI * 2;
      const dist = 80 + Math.random() * 220;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 60;
      const rot = Math.random() * 720 - 360;
      p.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)' });
      setTimeout(() => p.remove(), 1700);
    }
  }

  envelopeWrap.addEventListener('click', () => {
    if (opened) return;
    opened = true;
    envelopeWrap.classList.add('opening');
    burstConfetti();
    setTimeout(() => {
      envelopeWrap.classList.add('hidden');
      cardWrap.classList.add('show');
      burstConfetti();
    }, 650);
  });
</script>
